{% set name = "fps-akernel-task" %}
{% set version = "0.1.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/fps_akernel_task-{{ version }}.tar.gz
  sha256: 6191876f20cf956c7c77f396a01f4d8e0a7754db8688897d4610df93de1b4fe6

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - jupyverse-api >=0.12.0,<0.13.0
    - anyio
    - akernel >=0.3.4

test:
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - pip check
  imports:
    - fps_akernel_task

about:
  home: https://github.com/davidbrochart/akernel/tree/main/plugins/akernel_task
  summary: An FPS plugin for the kernel task API
  keywords: jupyter, server, fastapi, plugins
  dev_url: https://github.com/davidbrochart/akernel/tree/main/plugins/akernel_task
  license_file: LICENSE
  license: MIT
  license_family: MIT

extra:
  recipe-maintainers:
    - davidbrochart
